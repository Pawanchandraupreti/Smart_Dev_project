name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        run: |
          python -m py_compile check_labels.py check_loki.py fix_dashboards.py fix_json.py test_stack.py
          echo "Build and test passed"