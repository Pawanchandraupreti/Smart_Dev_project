name: CI Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project structure
        run: ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests 2>/dev/null || true

      - name: Lint Python files
        run: |
          python -m py_compile check_labels.py check_loki.py fix_dashboards.py fix_json.py test_stack.py
          echo "All Python files OK"

      - name: Validate docker-compose
        run: docker compose config > /dev/null && echo "docker-compose.yml is valid"