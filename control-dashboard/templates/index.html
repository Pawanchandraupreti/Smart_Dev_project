<!DOCTYPE html>
<html lang="en">
<head>
    <title>Control Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="mb-4">Centralized Observability Control Center</h1>
    <div class="row">
        <div class="col-md-6">
            <div class="card p-4 mb-4">
                <h3>Automation Controls</h3>
                <button class="btn btn-success mb-2" onclick="fetch('/api/start'); alert('Starting Stack...');">Start Monitoring Stack</button>
                <button class="btn btn-danger mb-2" onclick="fetch('/api/stop'); alert('Stopping Stack...');">Stop Stack</button>
                <button class="btn btn-warning mb-2" onclick="alert('Running Demo Traffic...');">Run Full Demo</button>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4 mb-4">
                <h3>Services</h3>
                <a href="http://localhost:3000" class="btn btn-primary mb-2" target="_blank">Frontend App</a>
                <a href="http://localhost:3005" class="btn btn-warning mb-2" target="_blank">Grafana Dashboards</a>
                <a href="http://localhost:9093" class="btn btn-danger mb-2" target="_blank">Alertmanager</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
